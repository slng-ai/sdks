openapi: 3.0.3
info:
  title: SLNG Gateway API - Unmute (SLNG official) Bridges
  version: 0.1.0
  description: Unified API for speech-to-text and text-to-speech services.
  contact:
    name: SLNG Support
    email: support@slng.ai
servers:
  - url: https://api.slng.ai
    description: Production
    x-api-token: zpka_your_api_key_here
security:
  - BearerAuth: []
paths:
  /v1/bridges/unmute/stt/{model_variant}:
    x-zuplo-path:
      pathMode: url-pattern
    parameters:
      - $ref: "#/components/parameters/SttModelVariantPath"
    post:
      operationId: unmute-stt-http
      summary: Unmute STT Bridge
      description: Transcribe a recorded file through the Unmute bridge over HTTP. The model_variant path parameter selects the target STT model (e.g., deepgram/nova:3, slng/deepgram/nova:3-en), and the gateway forwards the request to that model's HTTP API.
      tags:
        - "Type: Bridges"
        - "Provider: Unmute (SLNG official)"
        - Unmute STT Bridge
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UnmuteSttRequest"
            examples:
              binary:
                summary: Binary audio upload
                value:
                  audio: <binary>
                  language: en
          application/json:
            schema:
              $ref: "#/components/schemas/UnmuteSttRequest"
            examples:
              url:
                summary: URL-based transcription
                value:
                  url: https://docs.slng.ai/audio/hello.wav
                  language: en
      responses:
        "200":
          $ref: "#/components/responses/UnmuteSttHttpSuccess"
        "400":
          $ref: "#/components/responses/ProviderBadRequest"
        "401":
          $ref: "#/components/responses/ProviderUnauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenBearerToken"
        "500":
          $ref: "#/components/responses/ProviderInternalServerError"
        "503":
          $ref: "#/components/responses/ProviderServiceUnavailable"
      x-zuplo-route:
        corsPolicy: anything-goes
        handler:
          export: default
          module: $import(./routes/public/bridges/unmute/stt/{model_variant}/index)
          options: {}
        policies:
          inbound:
            - api-key-inbound
            - credit-precheck-inbound
      x-slng-service-type: bridges
      x-slng-provider-id: unmute
      x-slng-provider-name: Unmute (SLNG official)
  /v1/bridges/unmute/tts/{model_variant}:
    x-zuplo-path:
      pathMode: url-pattern
    parameters:
      - $ref: "#/components/parameters/TtsModelVariantPath"
    post:
      operationId: unmute-tts-http
      summary: Unmute TTS Bridge
      description: Synthesize speech through the Unmute bridge over HTTP. The model_variant path parameter selects the target TTS model (e.g., deepgram/aura:2), and the gateway maps `voice`, `text`, and `language` to that model's HTTP request fields. Models that only stream over SSE return 400 on this route; use the WebSocket channel instead.
      tags:
        - "Type: Bridges"
        - "Provider: Unmute (SLNG official)"
        - Unmute TTS Bridge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnmuteTtsRequest"
            examples:
              deepgram:
                summary: Deepgram Aura
                value:
                  voice: aura-2-thalia-en
                  text: Hello, this is a test of text to speech synthesis.
              fish:
                summary: SLNG-hosted Fish Audio S2.1 Pro
                value:
                  voice: 16cabdb7f8d240569aff36c9e480d783
                  text: Hello, this is a test of text to speech synthesis.
      responses:
        "200":
          $ref: "#/components/responses/TtsSynthesisSuccess"
        "400":
          $ref: "#/components/responses/ProviderBadRequest"
        "401":
          $ref: "#/components/responses/ProviderUnauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenBearerToken"
        "500":
          $ref: "#/components/responses/ProviderInternalServerError"
        "503":
          $ref: "#/components/responses/ProviderServiceUnavailable"
      x-zuplo-route:
        corsPolicy: anything-goes
        handler:
          export: default
          module: $import(./routes/public/bridges/unmute/tts/{model_variant}/index)
          options: {}
        policies:
          inbound:
            - api-key-inbound
            - credit-precheck-inbound
      x-slng-service-type: bridges
      x-slng-provider-id: unmute
      x-slng-provider-name: Unmute (SLNG official)
tags:
  - name: Unmute STT Bridge
    description: SLNG native STT protocol bridge, over HTTP and WebSocket.
  - name: Unmute TTS Bridge
    description: SLNG native TTS protocol bridge, over HTTP and WebSocket.
  - name: "Type: Bridges"
    description: Grouping by service type (Bridges).
  - name: "Provider: Unmute (SLNG official)"
    description: Grouping by provider (Unmute (SLNG official)).
components:
  responses:
    TtsSynthesisSuccess:
      description: Synthesis successful.
      content:
        audio/*:
          schema:
            $ref: "#/components/schemas/AudioBinary"
    ProviderServiceUnavailable:
      description: Service unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProviderErrorResponse"
    ProviderInternalServerError:
      description: Internal server error from the provider.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProviderErrorResponse"
          examples:
            processing-error:
              summary: Processing error
              value:
                error: Service error
                details: Internal processing error
    ForbiddenBearerToken:
      description: Missing or invalid Bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ProviderUnauthorized:
      description: Invalid or missing API key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProviderErrorResponse"
    ProviderBadRequest:
      description: Bad request - invalid parameters provided.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProviderErrorResponse"
          examples:
            validation-error:
              summary: Validation error
              value:
                error: Validation error
                details: "Missing required field: text"
    UnmuteSttHttpSuccess:
      description: Transcription successful. The body is the target model's native HTTP transcription response, returned unchanged.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnmuteSttHttpResponse"
          examples:
            deepgram-nova:
              summary: Deepgram Nova 3 response (abridged)
              value:
                results:
                  channels:
                    - alternatives:
                        - transcript: Hello from sunny Barcelona!
                          confidence: 0.99
  schemas:
    AudioBinary:
      type: string
      format: binary
      description: Binary audio data.
    UnmuteTtsRequest:
      type: object
      description: Unmute TTS request. The gateway maps `voice`, `text`, and `language` to the target model's field names and forwards any other field to that model's HTTP API unchanged.
      additionalProperties: true
      properties:
        voice:
          type: string
          description: Voice identifier for the selected model.
        text:
          type: string
          description: Text to synthesize.
        language:
          type: string
          description: Optional language hint; models with automatic or voice-selected language ignore it.
        pronunciation:
          type: object
          description: Optional pronunciation rewrite, applied where the selected model supports it. `mode` is always `rewrite`; supply exactly one of `name` (a dictionary name, 1–128 characters) or `dictionary_id`.
          required:
            - mode
          properties:
            mode:
              type: string
              enum:
                - rewrite
            name:
              type: string
              minLength: 1
              maxLength: 128
            dictionary_id:
              type: string
              minLength: 1
      required:
        - text
    ProviderErrorResponse:
      type: object
      description: |
        Provider error response. Contains error information from the upstream provider.
        Common errors include invalid speakers, unsupported languages, or malformed requests.
      properties:
        error:
          type: string
          description: Error type or category (e.g., "TTS service error", "Validation error").
          example: TTS service error
        status:
          type: number
          description: Original HTTP status code from the provider (may differ from gateway response code).
          example: 400
        details:
          type: string
          description: |
            Detailed error message from the provider. For TTS errors, this typically includes
            the specific validation failure (e.g., invalid speaker ID for the selected model/language).
          example: "Upstream provider error: 400 Bad Request - Invalid voice"
      required:
        - error
    ErrorResponse:
      type: object
      description: Standard error response.
      properties:
        error:
          type: string
          description: Error type or code.
        message:
          type: string
          description: Human-readable error message.
        statusCode:
          type: integer
          description: HTTP status code.
      required:
        - error
    UnmuteSttHttpResponse:
      type: object
      description: The target model's native HTTP transcription response, passed through unchanged. For example, Deepgram Nova returns `results.channels[].alternatives[]`. See the direct endpoint of the selected model for its exact shape.
      additionalProperties: true
    UnmuteSttRequest:
      type: object
      description: Unmute STT request. Provide either `audio` (multipart upload) or `url` (publicly accessible HTTPS URL).
      properties:
        audio:
          type: string
          format: binary
          description: Audio file (multipart) or base64-encoded audio (JSON).
        url:
          type: string
          description: Publicly accessible audio URL.
          example: https://docs.slng.ai/audio/hello.wav
        language:
          type: string
          description: Language code for recognition.
        sample_rate:
          type: integer
          description: Audio sample rate in Hz.
          enum:
            - 8000
            - 16000
            - 22050
            - 24000
            - 32000
            - 48000
        encoding:
          type: string
          description: Audio encoding format.
          enum:
            - linear16
            - mp3
            - opus
        enable_partials:
          type: boolean
          description: Enable partial transcription results.
  parameters:
    TtsModelVariantPath:
      name: model_variant
      in: path
      required: true
      description: Target TTS model. Any WebSocket-capable TTS model is supported.
      schema:
        type: string
        enum:
          - cartesia/sonic:3
          - cartesia/sonic:3.5
          - deepgram/aura:2
          - fish/tts:drama-3
          - fish/tts:s2-pro
          - fish/tts:s2.1-pro
          - gradium/tts:default
          - kugelaudio/kugel:2
          - murf/murftts:falcon
          - sarvam/bulbul:v3
          - slng/deepgram/aura:2-en
          - slng/fish/tts:s2.1-pro
          - soniox/tts-rt:v1
      examples:
        deepgramAura:
          summary: Deepgram Aura 2
          value: deepgram/aura:2
        slngFishS21Pro:
          summary: SLNG-hosted Fish Audio S2.1 Pro
          value: slng/fish/tts:s2.1-pro
    SttModelVariantPath:
      name: model_variant
      in: path
      required: true
      description: Target STT model. Must support WebSocket streaming with final_transcript.
      schema:
        type: string
        enum:
          - deepgram/nova:3
          - deepgram/nova:3-medical
          - gradium/stt:default
          - reson8/reson8stt:v1
          - sarvam/saaras:v3
          - slng/deepgram/nova:3-en
          - slng/deepgram/nova:3-hi
          - slng/deepgram/nova:3-id
          - slng/deepgram/nova:3-kn
          - slng/deepgram/nova:3-mr
          - slng/deepgram/nova:3-te
          - slng/speechmatics/realtime:v2
          - soniox/speech-ai:rt-v5
      examples:
        deepgramNova3:
          summary: Deepgram Nova 3
          value: deepgram/nova:3
        slngNova3En:
          summary: SLNG-hosted Deepgram Nova 3 (English)
          value: slng/deepgram/nova:3-en
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        API key issued by SLNG. Pass as `Authorization: Bearer <token>`.
