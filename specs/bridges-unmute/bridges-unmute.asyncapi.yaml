asyncapi: 3.0.0
info:
  title: SLNG Gateway API - Unmute (SLNG official) Bridges
  version: 0.1.0
  description: SLNG Gateway API
  contact:
    name: SLNG Support
    url: https://slng.ai
    email: support@slng.ai
  license:
    name: Proprietary
  tags:
    - name: "Type: Bridges"
      description: Bridge endpoints/channels.
    - name: "Provider: Unmute (SLNG official)"
      description: Unmute (SLNG native) bridge routes/channels.
    - name: Unmute STT Bridge
      description: SLNG native WebSocket STT protocol bridge.
    - name: Unmute TTS Bridge
      description: SLNG native WebSocket TTS protocol bridge.
servers:
  production:
    host: api.slng.ai
    protocol: wss
    description: Production
    x-api-token: zpka_your_api_key_here
    security:
      - $ref: "#/components/securitySchemes/bearer"
channels:
  /v1/bridges/unmute/stt/{model_variant}:
    address: /v1/bridges/unmute/stt/{model_variant}
    title: Unmute STT Bridge
    summary: Unmute STT Bridge
    description: >-
      Stream audio to any WebSocket-capable STT model over SLNG's native protocol. Send `init`, then audio as base64 `audio` messages or raw binary frames; the gateway returns `ready`, `partial_transcript`, `final_transcript`, provider-dependent `utterance_end`, and flat `error` frames. A `final_transcript` is a finalized segment that may be empty and is never a completion signal; `finalize` requests processing while input stays open; `close` is the definitive end of input, after which the client drains remaining results until the gateway closes the WebSocket with code 1000. Send `keepalive` every 3–5 seconds whenever input is open without audio (Nova); a WebSocket ping is not a keepalive. Optional `utterance_final` and `finalize_result` booleans report provider speech endpoints and finalize provenance and must not be treated as acknowledgements. The gateway emits no `duration` or `language` on transcripts.
    tags:
      - name: Unmute STT Bridge
      - name: "Type: Bridges"
        description: Grouping by service type (Bridges).
      - name: "Provider: Unmute (SLNG official)"
        description: Grouping by provider (Unmute (SLNG official)).
    servers:
      - $ref: "#/servers/production"
    messages:
      UnmuteSttInitMessage:
        $ref: "#/components/messages/UnmuteSttInitMessage"
      UnmuteSttAudioMessage:
        $ref: "#/components/messages/UnmuteSttAudioMessage"
      UnmuteSttFinalizeMessage:
        $ref: "#/components/messages/UnmuteSttFinalizeMessage"
      UnmuteSttCloseMessage:
        $ref: "#/components/messages/UnmuteSttCloseMessage"
      UnmuteSttKeepaliveMessage:
        $ref: "#/components/messages/UnmuteSttKeepaliveMessage"
      UnmuteSttReadyMessage:
        $ref: "#/components/messages/UnmuteSttReadyMessage"
      UnmuteSttPartialTranscript:
        $ref: "#/components/messages/UnmuteSttPartialTranscript"
      UnmuteSttFinalTranscript:
        $ref: "#/components/messages/UnmuteSttFinalTranscript"
      UnmuteSttUtteranceEnd:
        $ref: "#/components/messages/UnmuteSttUtteranceEnd"
      UnmuteSttErrorMessage:
        $ref: "#/components/messages/UnmuteSttErrorMessage"
    bindings:
      ws:
        method: GET
    x-slng-service-type: bridges
    x-slng-provider-id: unmute
    x-slng-provider-name: Unmute (SLNG official)
  /v1/bridges/unmute/tts/{model_variant}:
    address: /v1/bridges/unmute/tts/{model_variant}
    title: Unmute TTS Bridge
    summary: Unmute TTS Bridge
    description: >-
      Stream synthesized audio from any WebSocket-capable TTS model over SLNG's native protocol. Send `init` (the model comes from the route path; `model` in the body is advisory), `text` frames, and `flush` to end a turn. The gateway returns `ready`, raw binary audio frames in the init encoding and sample rate, a bare `audio_end` after each flushed turn, `cleared` after `clear`, and flat `error` frames. There is no JSON `audio_chunk`, no `flushed` event, and no `data` envelope on any message. Encodings and sample rates are model-specific: Deepgram Aura accepts linear16 (8000–48000 Hz), mulaw, and alaw (8000/16000 Hz) over WebSocket only; Fish Audio accepts linear16/pcm/wav (8000–44100 Hz), mp3 (32000/44100 Hz), and opus (48000 Hz).
    tags:
      - name: Unmute TTS Bridge
      - name: "Type: Bridges"
        description: Grouping by service type (Bridges).
      - name: "Provider: Unmute (SLNG official)"
        description: Grouping by provider (Unmute (SLNG official)).
    servers:
      - $ref: "#/servers/production"
    messages:
      UnmuteTtsInitMessage:
        $ref: "#/components/messages/UnmuteTtsInitMessage"
      UnmuteTtsTextMessage:
        $ref: "#/components/messages/UnmuteTtsTextMessage"
      UnmuteTtsFlushMessage:
        $ref: "#/components/messages/UnmuteTtsFlushMessage"
      UnmuteTtsClearMessage:
        $ref: "#/components/messages/UnmuteTtsClearMessage"
      UnmuteTtsCancelMessage:
        $ref: "#/components/messages/UnmuteTtsCancelMessage"
      UnmuteTtsCloseMessage:
        $ref: "#/components/messages/UnmuteTtsCloseMessage"
      UnmuteTtsKeepaliveMessage:
        $ref: "#/components/messages/UnmuteTtsKeepaliveMessage"
      UnmuteTtsReadyMessage:
        $ref: "#/components/messages/UnmuteTtsReadyMessage"
      UnmuteTtsBinaryAudio:
        $ref: "#/components/messages/UnmuteTtsBinaryAudio"
      UnmuteTtsClearedMessage:
        $ref: "#/components/messages/UnmuteTtsClearedMessage"
      UnmuteTtsAudioEndMessage:
        $ref: "#/components/messages/UnmuteTtsAudioEndMessage"
      UnmuteTtsErrorMessage:
        $ref: "#/components/messages/UnmuteTtsErrorMessage"
    bindings:
      ws:
        method: GET
    x-slng-service-type: bridges
    x-slng-provider-id: unmute
    x-slng-provider-name: Unmute (SLNG official)
