servers:
  production:
    host: api.slng.ai
    protocol: wss
    description: Production
    x-api-token: zpka_your_api_key_here
    security:
      - $ref: "#/components/securitySchemes/bearer"
  staging:
    host: stageapi.slng.ai
    protocol: wss
    description: Staging
