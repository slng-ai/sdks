components:
  messages:
    UnmuteSttInitMessage:
      name: UnmuteSttInitMessage
      title: Init (Unmute STT)
      summary: Initialize Unmute STT session with configuration.
      contentType: application/json
      payload:
        type: object
        description: >-
          Optional session configuration sent before audio. Besides the fields below, any provider-specific option declared by the selected model is passed through unchanged (Deepgram-backed models also accept `punctuate`, `smart_format`, `diarize`, `numerals`, `profanity_filter`). On SLNG-hosted Nova HTTP routes `smart_format=true` currently fails upstream while `punctuate=true` works; WebSocket `smart_format` on hosted routes has not been qualified.
        required:
          - type
        properties:
          type:
            type: string
            const: init
          config:
            type: object
            description: Session configuration. Each field applies only when the selected model declares it; only `sample_rate` and `encoding` apply to every model. A field the model does not declare is dropped without being validated or forwarded to the provider. Declared fields are validated; for example, an empty `keyterm` array is rejected on Deepgram Nova.
            properties:
              language:
                $ref: "#/components/schemas/LanguageCode"
                description: Recognition language. Reson8 ignores it, and Sarvam Saaras ignores it in favour of `language_code`.
              sample_rate:
                $ref: "#/components/schemas/SampleRate"
              channels:
                type: integer
                minimum: 1
                maximum: 16
                description: Input channel count. Optional on SLNG-hosted Nova routes (defaults to 1); used to meter raw audio exactly.
              encoding:
                type: string
                description: Input audio encoding. SLNG-hosted Nova routes accept `linear16` (8000/16000 Hz); other targets may accept the remaining values.
                enum:
                  - linear16
                  - LINEAR16
                  - pcm_s16le
                  - pcm_l16
                  - pcm_raw
                  - pcm_f32le
                  - wav
                  - mulaw
                  - mp3
                  - opus
              enable_partials:
                type: boolean
                description: Enable interim `partial_transcript` results. Required for Nova `utterance_end` events. Honoured by Deepgram Nova, Soniox, Speechmatics and Reson8; other models ignore it.
              endpointing:
                description: Deepgram Nova only; other models ignore it (Soniox uses `enable_endpoint_detection` and `max_endpoint_delay_ms`). Silence detector. Integer milliseconds of silence before a segment is finalized, or `false` to disable. Controls segment finalization, not utterance end.
              utterance_end_ms:
                type: integer
                minimum: 1000
                maximum: 5000
                description: "Deepgram Nova only; other models ignore it. Word-gap detector in milliseconds that produces `utterance_end` events. Requires `enable_partials: true`."
              keyterm:
                type: array
                description: Keyterms to boost recognition on Deepgram Nova 3 models; other models ignore it.
                items:
                  type: string
      examples:
        - name: unmuteSttInit
          summary: Initialize Unmute STT session
          payload:
            type: init
            config:
              language: en
              sample_rate: 16000
              channels: 1
              encoding: linear16
              enable_partials: true
    UnmuteSttAudioMessage:
      name: UnmuteSttAudioMessage
      title: Audio (Unmute STT)
      summary: Send audio data to Unmute STT Bridge.
      contentType: application/json
      payload:
        type: object
        description: >-
          Base64 audio in a JSON text frame. The same bytes may instead be sent as raw binary WebSocket frames; both forms are metered as input audio in the encoding declared by `init`. Silent PCM advances the audio stream and is metered; use `keepalive` for silence instead.
        required:
          - type
          - data
        properties:
          type:
            type: string
            const: audio
          data:
            type: string
            format: byte
            description: Base64-encoded audio bytes.
      examples:
        - name: unmuteSttAudio
          summary: Send audio data
          payload:
            type: audio
            data: UklGRiQAAABXQVZFZm10IBAAAAABAAEA...
    UnmuteSttFinalizeMessage:
      name: UnmuteSttFinalizeMessage
      title: Finalize (Unmute STT)
      summary: Request processing of buffered audio without closing input.
      contentType: application/json
      payload:
        type: object
        description: >-
          Requests processing and leaves input open. Nova does not guarantee a response and does not correlate results to this request: zero, one, or several final segments (including empty ones) may follow, and a later result may carry `finalize_result: true` as provenance only. Keep receiving and keep sending keepalives; do not pair finals with finalize requests or implement a completion timeout. Use `close` for a complete input stream.
        required:
          - type
        properties:
          type:
            type: string
            const: finalize
      examples:
        - name: unmuteSttFinalize
          summary: Request processing, input stays open
          payload:
            type: finalize
    UnmuteSttCloseMessage:
      name: UnmuteSttCloseMessage
      title: Close (Unmute STT)
      summary: Close audio input and drain remaining results.
      contentType: application/json
      payload:
        type: object
        description: >-
          Signals that no more audio will be sent. The gateway forwards the provider's close-stream control, keeps delivering every remaining result, and then closes the WebSocket with code 1000. Successful closure after `close` is the only definitive completion signal; a final transcript or utterance boundary alone is not. Use a new connection for the next independent input.
        required:
          - type
        properties:
          type:
            type: string
            const: close
      examples:
        - name: unmuteSttClose
          summary: Close the audio stream
          payload:
            type: close
    UnmuteSttKeepaliveMessage:
      name: UnmuteSttKeepaliveMessage
      title: Keepalive (Unmute STT)
      summary: Application keepalive while input is open without audio.
      contentType: application/json
      payload:
        type: object
        description: >-
          Carries no audio and produces no reply. For Nova, send every 3–5 seconds whenever input remains open without audio; the provider ends idle streams after roughly ten seconds. The gateway forwards it as the provider's native keepalive and resets its own idle timeout, but it never extends the maximum session duration. A WebSocket ping is answered but is not an application keepalive.
        required:
          - type
        properties:
          type:
            type: string
            const: keepalive
      examples:
        - name: unmuteSttKeepalive
          summary: Send keepalive
          payload:
            type: keepalive
    UnmuteSttReadyMessage:
      name: UnmuteSttReadyMessage
      title: Ready (Unmute STT)
      summary: Unmute STT session is ready.
      contentType: application/json
      payload:
        type: object
        description: >-
          Sent once after the upstream session is open. `session_id` and `slng_request_id` carry the same gateway request identifier; quote it when reporting problems.
        required:
          - type
          - session_id
          - slng_request_id
        properties:
          type:
            type: string
            const: ready
          session_id:
            type: string
            description: Gateway request identifier for this session.
          slng_request_id:
            type: string
            description: SLNG request identifier (same value as `session_id`) for log correlation.
      examples:
        - name: unmuteSttReady
          summary: Session ready
          payload:
            type: ready
            session_id: 2c9953d7-d4b4-4385-bb27-f64e0d979be5
            slng_request_id: 2c9953d7-d4b4-4385-bb27-f64e0d979be5
    UnmuteSttPartialTranscript:
      name: UnmuteSttPartialTranscript
      title: Partial Transcript (Unmute STT)
      summary: Interim (revisable) transcription result.
      contentType: application/json
      payload:
        type: object
        description: >-
          Revisable segment text; replace provisional text with the latest partial. Only `type` and `transcript` are always present.
        required:
          - type
          - transcript
        properties:
          type:
            type: string
            const: partial_transcript
          transcript:
            type: string
            description: Interim text so far.
          confidence:
            type: number
            description: Provider confidence (0-1) when reported.
          utterance_final:
            type: boolean
            description: Present only when the provider reports a speech endpoint for this result (Nova `speech_final`). Not stream completion and not a turn acknowledgement.
          finalize_result:
            type: boolean
            description: Present only when the provider attributes this result to finalize processing (Nova `from_finalize`). Informational provenance; uncorrelated with any specific `finalize` and not proof that all submitted audio was processed.
      examples:
        - name: unmuteSttPartial
          summary: Partial transcript
          payload:
            type: partial_transcript
            transcript: Hello wor
            confidence: 0.85
    UnmuteSttFinalTranscript:
      name: UnmuteSttFinalTranscript
      title: Final Transcript (Unmute STT)
      summary: A finalized segment, possibly empty.
      contentType: application/json
      payload:
        type: object
        description: >-
          A finalized segment. Append nonempty text in arrival order and keep receiving: segment finality does not close input or complete the stream, and an empty segment is never a completion sentinel. Only `type` and `transcript` are always present. The gateway emits no `duration`, `language`, or timing fields on this message; absent optional booleans mean the provider did not report them (they are never filled with `false`).
        required:
          - type
          - transcript
        properties:
          type:
            type: string
            const: final_transcript
          transcript:
            type: string
            description: Finalized segment text; may be an empty string.
          confidence:
            type: number
            description: Provider confidence (0-1) when reported.
          utterance_final:
            type: boolean
            description: Present only when the provider reports a speech endpoint for this result (Nova `speech_final`). Not stream completion and not a turn acknowledgement.
          finalize_result:
            type: boolean
            description: Present only when the provider attributes this result to finalize processing (Nova `from_finalize`). Informational provenance; uncorrelated with any specific `finalize` and not proof that all submitted audio was processed.
      examples:
        - name: unmuteSttFinal
          summary: Final transcript
          payload:
            type: final_transcript
            transcript: Hello world
            confidence: 0.95
        - name: unmuteSttFinalWithProvenance
          summary: Final transcript with provider speech endpoint and finalize provenance
          payload:
            type: final_transcript
            transcript: micro machines
            confidence: 0.99
            utterance_final: true
            finalize_result: true
        - name: unmuteSttFinalEmpty
          summary: Empty final segment (keep receiving; not completion)
          payload:
            type: final_transcript
            transcript: ""
    UnmuteSttUtteranceEnd:
      name: UnmuteSttUtteranceEnd
      title: Utterance End (Unmute STT)
      summary: Provider-dependent end-of-utterance marker.
      contentType: application/json
      payload:
        type: object
        description: >-
          Emitted independently of `final_transcript` when the provider reports a word-gap utterance boundary. It is not stream completion and does not cover queued audio. Nova sends it only when `utterance_end_ms` is set together with `enable_partials: true`, with `last_word_end` and `channel`; `stream_id` is supplied by Gradium only. Providers without endpoint detection never send it.
        required:
          - type
        properties:
          type:
            type: string
            const: utterance_end
          last_word_end:
            type: number
            description: Audio timestamp in seconds of the last transcribed word, when reported.
          channel:
            type: array
            description: Provider channel index for the boundary, when reported.
            items:
              type: integer
          stream_id:
            type: integer
            description: Provider stream identifier (Gradium only).
      examples:
        - name: unmuteSttUtteranceEndNova
          summary: Nova utterance end
          payload:
            type: utterance_end
            last_word_end: 2.395
            channel:
              - 0
        - name: unmuteSttUtteranceEndMarker
          summary: Marker-only utterance end
          payload:
            type: utterance_end
    UnmuteSttErrorMessage:
      name: UnmuteSttErrorMessage
      title: Error (Unmute STT)
      summary: Error occurred during Unmute STT session.
      contentType: application/json
      payload:
        type: object
        description: >-
          Flat error frame; there is no nested `data` envelope. Gateway-generated codes are `config_error`, `processing_error`, `provider_error`, and `rate_limit` (oversize payloads and message-rate breaches both report `rate_limit`); these and provider errors translated by the gateway always carry `slng_request_id`. A provider frame that already has `type: error` and that the provider's catalog does not declare is forwarded verbatim (reson8), so `code` is then the provider's own value (possibly numeric) and `slng_request_id` is absent. Branch on `code`, not on `message` text. Authentication failures are rejected at the HTTP upgrade and never arrive as this message.
        required:
          - type
          - code
          - message
        properties:
          type:
            type: string
            const: error
          code:
            type:
              - string
              - integer
            description: Error code. Gateway codes are strings; a verbatim provider passthrough keeps the provider's value, which may be numeric.
          message:
            type: string
            description: Human-readable error description; wording may change.
          slng_request_id:
            type: string
            description: SLNG request identifier for log correlation; present on every gateway-generated or gateway-translated error, absent on a verbatim provider passthrough.
      examples:
        - name: unmuteSttError
          summary: STT error
          payload:
            type: error
            code: provider_error
            message: STT provider completed before input close
            slng_request_id: 2c9953d7-d4b4-4385-bb27-f64e0d979be5
        - name: unmuteSttErrorProviderPassthrough
          summary: Verbatim provider error (numeric code, no slng_request_id)
          payload:
            type: error
            code: 503
            message: upstream unavailable
    UnmuteTtsInitMessage:
      name: UnmuteTtsInitMessage
      title: Init (Unmute TTS)
      summary: Initialize Unmute TTS session with voice and configuration.
      contentType: application/json
      payload:
        type: object
        description: >-
          Opens the provider session. The model comes from the route path; `model` in the body is advisory and discarded. `config.encoding` and `config.sample_rate` are validated against the selected model before any provider connection and rejected with a `config_error` otherwise.
        required:
          - type
        properties:
          type:
            type: string
            const: init
          model:
            type: string
            description: Advisory and optional. Never honoured or forwarded; the route path selects the model.
          voice:
            type: string
            description: Voice identifier for the selected model.
          pronunciation:
            type: object
            description: >-
              Optional pronunciation rewrite. `mode` is always `rewrite`; supply
              exactly one of `name` (a dictionary name, 1–128 characters) or
              `dictionary_id`.
            required:
              - mode
            properties:
              mode:
                type: string
                const: rewrite
              name:
                type: string
                minLength: 1
                maxLength: 128
              dictionary_id:
                type: string
                minLength: 1
          config:
            type: object
            description: Synthesis configuration.
            properties:
              sample_rate:
                $ref: "#/components/schemas/SampleRate"
                description: >-
                  Must be supported by the selected model and encoding. Deepgram Aura over WebSocket:
                  linear16 accepts 8000/16000/24000/32000/48000, mulaw and alaw accept 8000/16000
                  (default 24000). Fish Audio: linear16/pcm/wav accept 8000/16000/24000/32000/44100,
                  mp3 accepts 32000/44100, opus accepts 48000 only (default 44100, opus 48000).
              encoding:
                type: string
                description: >-
                  Union across bridge targets; each route accepts only its own subset. Deepgram Aura over
                  WebSocket accepts linear16, mulaw, and alaw only (mp3/opus/flac are HTTP-only for Aura).
                  Fish Audio accepts linear16 (alias of pcm), pcm, wav, mp3, and opus.
                enum:
                  - linear16
                  - mp3
                  - opus
                  - mulaw
                  - alaw
                  - flac
                  - aac
                  - wav
                  - pcm
              language:
                $ref: "#/components/schemas/LanguageCode"
                description: Optional language hint; models with automatic or voice-selected language accept and ignore it.
              speed:
                type: number
                description: Optional speaking-speed hint in the selected model's units; models without a speed control accept and ignore it.
              pronunciation:
                type: object
                description: >-
                  Optional pronunciation rewrite. `mode` is always `rewrite`; supply
                  exactly one of `name` (a dictionary name, 1–128 characters) or
                  `dictionary_id`.
                required:
                  - mode
                properties:
                  mode:
                    type: string
                    const: rewrite
                  name:
                    type: string
                    minLength: 1
                    maxLength: 128
                  dictionary_id:
                    type: string
                    minLength: 1
      examples:
        - name: unmuteTtsInitAura
          summary: Deepgram Aura over the bridge (linear16 at 24 kHz)
          payload:
            type: init
            voice: aura-2-thalia-en
            config:
              sample_rate: 24000
              encoding: linear16
        - name: unmuteTtsInitFish
          summary: Fish Audio over the bridge (mp3 at 44.1 kHz)
          payload:
            type: init
            voice: 9a9cf47702da476aa4629e2506d4a857
            config:
              sample_rate: 44100
              encoding: mp3
    UnmuteTtsTextMessage:
      name: UnmuteTtsTextMessage
      title: Text (Unmute TTS)
      summary: Send text to synthesize.
      contentType: application/json
      payload:
        type: object
        description: >-
          Text for the current turn. `flush: true` ends the turn with this text.
          Set `partial: true` on a frame that ends mid-sentence when more of the
          same sentence follows.
        required:
          - type
          - text
        properties:
          type:
            type: string
            const: text
          text:
            type: string
            description: Text to synthesize.
          flush:
            type: boolean
            description: Flush the turn immediately after this text.
          partial:
            type: boolean
            description: >-
              Marks this frame as the start or middle of a sentence that the
              next text frames continue. The gateway either sends it on or holds
              it and sends it joined to the next frame, whichever suits the
              provider. Held text is joined exactly as sent, with no added
              spaces. Cannot be combined with `flush: true`. A frame with
              `partial: true` may contain only `type`, `text`, `partial`,
              `pronunciation`, and `flush: false`. End the sentence with an
              ordinary text frame or a `flush`; if the connection closes first,
              held text is discarded. Where the gateway sends the fragment on,
              the provider receives it unchanged, so send at least a clause at a
              time: single words can be voiced one at a time. Send `partial`
              only when `ready` includes `accepts_partial_text: true`.
          pronunciation:
            type: object
            description: >-
              Optional pronunciation rewrite. `mode` is always `rewrite`; supply
              exactly one of `name` (a dictionary name, 1–128 characters) or
              `dictionary_id`.
            required:
              - mode
            properties:
              mode:
                type: string
                const: rewrite
              name:
                type: string
                minLength: 1
                maxLength: 128
              dictionary_id:
                type: string
                minLength: 1
      examples:
        - name: unmuteTtsText
          summary: Send text
          payload:
            type: text
            text: Hello, how can I help you?
        - name: unmuteTtsPartialText
          summary: Send the opening of a sentence before the rest exists
          payload:
            type: text
            text: "Thanks for holding on, "
            partial: true
    UnmuteTtsFlushMessage:
      name: UnmuteTtsFlushMessage
      title: Flush (Unmute TTS)
      summary: End the current turn and synthesize buffered text.
      contentType: application/json
      payload:
        type: object
        description: >-
          Ends the current turn. Binary audio frames follow and the turn terminates with a bare `audio_end`; there is no `flushed` acknowledgement.
        required:
          - type
        properties:
          type:
            type: string
            const: flush
      examples:
        - name: unmuteTtsFlush
          summary: End the turn
          payload:
            type: flush
    UnmuteTtsClearMessage:
      name: UnmuteTtsClearMessage
      title: Clear (Unmute TTS)
      summary: Discard queued output for the current turn.
      contentType: application/json
      payload:
        type: object
        description: >-
          Cancels the active provider turn and discards queued output. The gateway replies with `cleared`.
        required:
          - type
        properties:
          type:
            type: string
            const: clear
      examples:
        - name: unmuteTtsClear
          summary: Discard queued output
          payload:
            type: clear
    UnmuteTtsCancelMessage:
      name: UnmuteTtsCancelMessage
      title: Cancel (Unmute TTS)
      summary: Cancel the current synthesis turn.
      contentType: application/json
      payload:
        type: object
        description: >-
          Cancels the current synthesis turn without a dedicated acknowledgement; the session stays open for the next turn.
        required:
          - type
        properties:
          type:
            type: string
            const: cancel
      examples:
        - name: unmuteTtsCancel
          summary: Cancel the turn
          payload:
            type: cancel
    UnmuteTtsCloseMessage:
      name: UnmuteTtsCloseMessage
      title: Close (Unmute TTS)
      summary: Close the session.
      contentType: application/json
      payload:
        type: object
        description: >-
          Ends the session after in-flight audio is delivered.
        required:
          - type
        properties:
          type:
            type: string
            const: close
      examples:
        - name: unmuteTtsClose
          summary: Close session
          payload:
            type: close
    UnmuteTtsKeepaliveMessage:
      name: UnmuteTtsKeepaliveMessage
      title: Keepalive (Unmute TTS)
      summary: Keep an idle session open.
      contentType: application/json
      payload:
        type: object
        description: >-
          Resets the gateway idle timeout and is forwarded upstream only for providers with a native keepalive frame (Sarvam). It produces no reply and never extends the maximum session duration.
        required:
          - type
        properties:
          type:
            type: string
            const: keepalive
      examples:
        - name: unmuteTtsKeepalive
          summary: Send keepalive
          payload:
            type: keepalive
    UnmuteTtsReadyMessage:
      name: UnmuteTtsReadyMessage
      title: Ready (Unmute TTS)
      summary: Unmute TTS session is ready.
      contentType: application/json
      payload:
        type: object
        description: >-
          Sent once after the upstream session is open. `session_id` and `slng_request_id` carry the same gateway request identifier.
        required:
          - type
          - session_id
          - slng_request_id
        properties:
          type:
            type: string
            const: ready
          session_id:
            type: string
            description: Gateway request identifier for this session.
          slng_request_id:
            type: string
            description: SLNG request identifier (same value as `session_id`) for log correlation.
          accepts_partial_text:
            type: boolean
            description: >-
              `true` when this gateway honours `partial` on text frames. Absent
              when it does not, in which case do not send `partial`.
      examples:
        - name: unmuteTtsReady
          summary: Session ready
          payload:
            type: ready
            session_id: 1e1a9598-077e-4d9d-aba6-78af6363f27c
            slng_request_id: 1e1a9598-077e-4d9d-aba6-78af6363f27c
            accepts_partial_text: true
    UnmuteTtsBinaryAudio:
      name: UnmuteTtsBinaryAudio
      title: Binary Audio Frame
      summary: Raw binary audio frame from Unmute TTS.
      contentType: application/octet-stream
      payload:
        type: object
        description: >-
          Synthesized audio is delivered only as raw binary WebSocket frames in the encoding and sample rate
          selected at init. This is NOT a JSON message and there is no base64 `audio_chunk` envelope. The
          object schema below exists only because the AsyncAPI tooling requires one.
        required:
          - type
        properties:
          type:
            type: string
            const: binary
            description: Placeholder discriminator. The actual message is a raw binary WebSocket frame, not JSON.
      examples:
        - name: unmuteTtsBinaryAudio
          summary: Raw binary audio buffer (e.g. linear16 PCM at 24kHz)
          payload: 
    UnmuteTtsClearedMessage:
      name: UnmuteTtsClearedMessage
      title: Cleared (Unmute TTS)
      summary: Queued output was discarded.
      contentType: application/json
      payload:
        type: object
        description: >-
          Acknowledges a client `clear`; queued provider output for the turn was discarded.
        required:
          - type
        properties:
          type:
            type: string
            const: cleared
      examples:
        - name: unmuteTtsCleared
          summary: Clear acknowledged
          payload:
            type: cleared
    UnmuteTtsAudioEndMessage:
      name: UnmuteTtsAudioEndMessage
      title: Audio End (Unmute TTS)
      summary: Bare turn boundary after the last audio frame.
      contentType: application/json
      payload:
        type: object
        description: >-
          Sent after the last binary audio frame of a flushed turn, on cache replay, and when the provider transport closes cleanly. The frame is exactly `{"type":"audio_end"}`: no `duration`, no payload, no nested `data`.
        required:
          - type
        properties:
          type:
            type: string
            const: audio_end
      examples:
        - name: unmuteTtsAudioEnd
          summary: Audio end
          payload:
            type: audio_end
    UnmuteTtsErrorMessage:
      name: UnmuteTtsErrorMessage
      title: Error (Unmute TTS)
      summary: Error occurred during Unmute TTS session.
      contentType: application/json
      payload:
        type: object
        description: >-
          Flat error frame; there is no nested `data` envelope. Provider errors are forwarded with the provider's own `code` value (which may be numeric) or `provider_error` when the provider gave none. Gateway-generated TTS session errors use string codes such as `config_error`, `provider_error`, `rate_limit_exceeded`, `payload_too_large`, `processing_error`, `watermarking_error`, `unsupported_watermark_format`, and `invalid_pronunciation`. `slng_request_id` is present only on pronunciation errors; use the `ready` message for correlation otherwise.
        required:
          - type
          - code
          - message
        properties:
          type:
            type: string
            const: error
          code:
            type:
              - string
              - integer
            description: Error code. Gateway codes are strings; a provider-forwarded code keeps the provider's value, which may be numeric.
          message:
            type: string
            description: Human-readable error description; wording may change.
          slng_request_id:
            type: string
            description: SLNG request identifier, present only on pronunciation errors.
      examples:
        - name: unmuteTtsError
          summary: TTS error
          payload:
            type: error
            code: provider_error
            message: Upstream service unavailable
        - name: unmuteTtsErrorProviderCode
          summary: Provider error forwarded with its numeric code
          payload:
            type: error
            code: 500
            message: boom
  schemas:
    LanguageCode:
      type: string
      description: ISO-639-1 language code.
      enum:
        - en
        - ja
        - zh
        - de
        - hi
        - fr
        - ko
        - pt
        - it
        - es
        - id
        - nl
        - tr
        - fil
        - pl
        - sv
        - bg
        - ro
        - ar
        - cs
        - el
        - fi
        - hr
        - ms
        - sk
        - da
        - ta
        - uk
        - ru
        - hu
        - no
        - vi
    SampleRate:
      type: integer
      description: Audio sample rate in Hz.
      enum:
        - 8000
        - 16000
        - 22050
        - 24000
        - 32000
        - 44100
        - 48000
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        API key issued by SLNG. Pass as `Authorization: Bearer <token>` in the WebSocket upgrade request headers.
