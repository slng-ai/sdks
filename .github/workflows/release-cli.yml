name: release-cli

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to release (e.g. cli-v0.1.0). Must already exist."
        required: true

permissions:
  contents: write

# The release's tag. The version comes from it: nobody bumps cli/package.json
# by hand. A manual run (workflow_dispatch) re-releases an existing tag.
env:
  TAG: ${{ inputs.version || github.ref_name }}

jobs:
  # Bun's --compile produces a self-contained binary per target. Most matrix
  # entries run on a native host; darwin-x64 cross-compiles from macos-latest
  # (arm64) because GitHub's macos-13 (Intel) runner pool has unbounded queue
  # times — the v0.1.1 run sat 24h before timing out.
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            asset: voiceai-darwin-arm64
          - os: macos-latest
            target: bun-darwin-x64
            asset: voiceai-darwin-x64
          - os: ubuntu-latest
            target: bun-linux-x64
            asset: voiceai-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            asset: voiceai-linux-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # The binary reads its --version from cli/package.json at compile time.
      - name: set version from tag
        shell: bash
        run: |
          version="${TAG#cli-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag $TAG is not cli-v<semver>" >&2
            exit 1
          fi
          (cd cli && npm pkg set version="$version")

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned, so a new Bun can't change a release build. Bump it on purpose.
          bun-version: 1.3.14

      - name: install
        run: bun install --frozen-lockfile

      - name: compile
        # --no-compile-autoload-dotenv: a standalone binary would otherwise read
        # .env from whatever folder it runs in, and a project's SLNG_API_KEY
        # would quietly beat the user's login.
        run: |
          bun build cli/src/index.ts \
            --compile \
            --no-compile-autoload-dotenv \
            --target=${{ matrix.target }} \
            --outfile ${{ matrix.asset }}

      - name: smoke
        # Skip cross-arch runs we can't execute on the build host.
        # bun-darwin-x64 is cross-compiled from macos-latest (arm64), so its
        # binary can't run here either.
        if: matrix.target != 'bun-linux-arm64' && matrix.target != 'bun-darwin-x64'
        run: |
          test "$(./${{ matrix.asset }} --version)" = "${TAG#cli-v}"
          # The binary must ignore a .env in the folder it runs in.
          bin="$PWD/${{ matrix.asset }}"
          d=$(mktemp -d)
          echo 'VOICEAI_REGION=from-dotenv' > "$d/.env"
          out=$(cd "$d" && HOME="$d" XDG_CONFIG_HOME="$d" "$bin" config get region || true)
          if [ "$out" = "from-dotenv" ]; then echo "the binary loaded .env from its working folder"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: github release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: compute version
        id: ver
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "semver=${TAG#cli-v}" >> "$GITHUB_OUTPUT"

      - name: create release + upload binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: voiceai ${{ steps.ver.outputs.semver }}
          fail_on_unmatched_files: true
          files: dist/voiceai-*
          generate_release_notes: true
          body: |
            CLI release v${{ steps.ver.outputs.semver }}.

            Install:
              brew install slng-ai/tap/voiceai
              curl -fsSL https://docs.slng.ai/install.sh | sh
              npm i -g voiceai-cli@${{ steps.ver.outputs.semver }}

  publish-npm:
    name: npm publish
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # required for both `npm publish --provenance` (Sigstore attestation)
      # and Trusted Publisher auth (OIDC exchange with npmjs.com).
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11.x natively. Required for Trusted Publishing
          # (npm ≥ 11.5.1). Don't downgrade to 22 LTS — its bundled npm 10.x
          # can't self-upgrade in CI without hitting a promise-retry crash.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: set version from tag
        working-directory: cli
        run: npm pkg set version="${TAG#cli-v}"

      - name: publish
        working-directory: cli
        run: npm publish --access public --provenance --ignore-scripts

  bump-homebrew:
    name: bump homebrew formula
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: compute SHAs + clone tap
        id: shas
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#cli-v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          for asset in voiceai-darwin-arm64 voiceai-darwin-x64 voiceai-linux-arm64 voiceai-linux-x64; do
            sha="$(sha256sum "dist/$asset" | cut -d' ' -f1)"
            echo "sha_${asset//-/_}=$sha" >> "$GITHUB_OUTPUT"
          done

      # Commits straight to the tap's main, as unmute's release does. The token
      # needs Contents: write on slng-ai/homebrew-tap, and nothing else.
      - name: commit the formula to the tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.shas.outputs.version }}"
          sha_darwin_arm64="${{ steps.shas.outputs.sha_voiceai_darwin_arm64 }}"
          sha_darwin_x64="${{ steps.shas.outputs.sha_voiceai_darwin_x64 }}"
          sha_linux_arm64="${{ steps.shas.outputs.sha_voiceai_linux_arm64 }}"
          sha_linux_x64="${{ steps.shas.outputs.sha_voiceai_linux_x64 }}"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/slng-ai/homebrew-tap.git" tap
          cd tap

          mkdir -p Formula
          cat > Formula/voiceai.rb <<RUBY
          class Voiceai < Formula
            desc "Voiceai CLI — text-to-speech, speech-to-text, streaming"
            homepage "https://slng.ai"
            version "${version}"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/slng-ai/sdks/releases/download/cli-v${version}/voiceai-darwin-arm64"
                sha256 "${sha_darwin_arm64}"
              else
                url "https://github.com/slng-ai/sdks/releases/download/cli-v${version}/voiceai-darwin-x64"
                sha256 "${sha_darwin_x64}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/slng-ai/sdks/releases/download/cli-v${version}/voiceai-linux-arm64"
                sha256 "${sha_linux_arm64}"
              else
                url "https://github.com/slng-ai/sdks/releases/download/cli-v${version}/voiceai-linux-x64"
                sha256 "${sha_linux_x64}"
              end
            end

            depends_on "sox" => :recommended  # required for STT mic recording

            def install
              bin.install Dir["voiceai-*"].first => "voiceai"
            end

            def caveats
              <<~EOS
                Config lives at ~/.config/voiceai/ and is NOT removed by \`brew uninstall\`.
                To wipe it (and the legacy ~/.config/slng/) before uninstalling, run:
                  voiceai config reset --force
              EOS
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/voiceai --version")
            end
          end
          RUBY

          git config user.name  "voiceai-release-bot"
          git config user.email "noreply@slng.ai"

          git add Formula/voiceai.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged, nothing to commit"
            exit 0
          fi

          git commit -m "voiceai ${version}"
          git push origin HEAD:main
